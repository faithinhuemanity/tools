<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cycle Timer</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121821;
      --panel-2: #18212d;
      --text: #f3f7fb;
      --muted: #9fb0c3;
      --accent: #56c2ff;
      --good: #62e6a6;
      --warn: #ffd166;
      --danger: #ff6b6b;
      --border: #2a3645;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0b0f14 0%, #101722 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(980px, 100%);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 0.04em;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .field, .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .unit {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }

    input {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 12px;
      font-size: 22px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card-title {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .value {
      font-variant-numeric: tabular-nums;
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 800;
    }

    .ready {
      grid-column: 1 / -1;
      border-color: #356b83;
      background: #102330;
    }

    .ready .value {
      font-size: clamp(42px, 8vw, 76px);
      color: var(--accent);
    }

    .counter .value {
      color: var(--good);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      flex: 1 1 140px;
      min-height: 54px;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    #startBtn { background: var(--good); color: #08120e; }
    #pauseBtn { background: var(--warn); color: #181305; }
    #resetBtn { background: var(--danger); color: #1a0808; }

    .status {
      margin-top: 14px;
      color: var(--muted);
      min-height: 22px;
    }

    .ready-flash {
      animation: flash 0.7s ease-in-out 3;
    }

    @keyframes flash {
      0%, 100% { background: #102330; }
      50% { background: #19465e; }
    }

    @media (max-width: 720px) {
      .grid, .metrics {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .grid, .metrics {
        grid-template-columns: 1fr;
      }
      .ready {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Cycle Timer</h1>
    <div class="subtitle">AT + SD + BED = time for each cycle. RC controls the full reset.</div>

    <section class="grid">
      <div class="field">
        <label for="at">AT</label>
        <input id="at" type="number" min="0" step="0.001" value="0.500" />
        <div class="unit">decimal minutes</div>
      </div>

      <div class="field">
        <label for="sd">SD</label>
        <input id="sd" type="number" min="0" step="0.001" value="7.000" />
        <div class="unit">seconds</div>
      </div>

      <div class="field">
        <label for="bed">BED</label>
        <input id="bed" type="number" min="0" step="0.001" value="1.000" />
        <div class="unit">seconds</div>
      </div>

      <div class="field">
        <label for="rc">RC</label>
        <input id="rc" type="number" min="1" step="1" value="5" />
        <div class="unit">cycle count before full reset</div>
      </div>
    </section>

    <section class="metrics">
      <div class="card">
        <div class="card-title">Time for each</div>
        <div class="value" id="eachTime">00:38.000</div>
      </div>

      <div class="card counter">
        <div class="card-title">Current count</div>
        <div class="value" id="countDisplay">0</div>
      </div>

      <div class="card">
        <div class="card-title">Current interval remaining</div>
        <div class="value" id="intervalRemaining">00:38.000</div>
      </div>

      <div class="card">
        <div class="card-title">Total time</div>
        <div class="value" id="totalTime">03:10.000</div>
      </div>

      <div class="card ready" id="readyCard">
        <div class="card-title">Time till ready</div>
        <div class="value" id="readyTime">03:10.000</div>
      </div>
    </section>

    <section class="controls">
      <button id="startBtn">START</button>
      <button id="pauseBtn">PAUSE</button>
      <button id="resetBtn">RESET</button>
    </section>

    <div class="status" id="status">Ready.</div>
  </main>

  <script>
    const atInput = document.getElementById("at");
    const sdInput = document.getElementById("sd");
    const bedInput = document.getElementById("bed");
    const rcInput = document.getElementById("rc");

    const eachTimeEl = document.getElementById("eachTime");
    const countDisplayEl = document.getElementById("countDisplay");
    const intervalRemainingEl = document.getElementById("intervalRemaining");
    const totalTimeEl = document.getElementById("totalTime");
    const readyTimeEl = document.getElementById("readyTime");
    const statusEl = document.getElementById("status");
    const readyCard = document.getElementById("readyCard");

    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");

    let running = false;
    let startTimestamp = 0;
    let pausedElapsedMs = 0;
    let animationId = null;
    let finished = false;
    let lastAbsoluteCycle = 0;
    let lastSequenceNumber = 0;

    function getValues() {
      const atMinutes = Math.max(0, Number(atInput.value) || 0);
      const sdSeconds = Math.max(0, Number(sdInput.value) || 0);
      const bedSeconds = Math.max(0, Number(bedInput.value) || 0);
      const rc = Math.max(1, Math.floor(Number(rcInput.value) || 1));

      const eachMs = ((atMinutes * 60) + sdSeconds + bedSeconds) * 1000;
      const totalMs = eachMs * rc;

      return { eachMs, totalMs, rc };
    }

    function formatTime(ms) {
      ms = Math.max(0, ms);

      const totalMilliseconds = Math.floor(ms);
      const milliseconds = totalMilliseconds % 1000;
      const totalSeconds = Math.floor(totalMilliseconds / 1000);
      const seconds = totalSeconds % 60;
      const totalMinutes = Math.floor(totalSeconds / 60);
      const minutes = totalMinutes % 60;
      const hours = Math.floor(totalMinutes / 60);

      const msText = String(milliseconds).padStart(3, "0");
      const secText = String(seconds).padStart(2, "0");
      const minText = String(minutes).padStart(2, "0");

      if (hours > 0) {
        return `${String(hours).padStart(2, "0")}:${minText}:${secText}.${msText}`;
      }

      return `${minText}:${secText}.${msText}`;
    }

    function playTone(frequency, duration = 0.16, volume = 0.14, delay = 0) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.frequency.value = frequency;
        gain.gain.value = volume;

        const startAt = ctx.currentTime + delay;
        oscillator.start(startAt);
        oscillator.stop(startAt + duration);
      } catch (e) {
        // Audio may be blocked by browser policy; timer still works.
      }
    }

    function countAlarm() {
      // Normal count alarm
      playTone(880, 0.16, 0.14);
    }

    function resetAlarm() {
      // Distinct alarm when the sequence rolls back to 0
      playTone(620, 0.22, 0.16, 0);
      playTone(1040, 0.28, 0.16, 0.28);
    }

    function updateStaticDisplay() {
      if (running) return;

      const { eachMs, totalMs } = getValues();
      eachTimeEl.textContent = formatTime(eachMs);
      intervalRemainingEl.textContent = formatTime(eachMs);
      totalTimeEl.textContent = formatTime(totalMs);
      readyTimeEl.textContent = formatTime(totalMs);
      countDisplayEl.textContent = "0";

      pausedElapsedMs = 0;
      finished = false;
      lastAbsoluteCycle = 0;
      lastSequenceNumber = 0;
      statusEl.textContent = "Ready.";
      readyCard.classList.remove("ready-flash");
    }

    function render() {
      if (!running) return;

      const now = performance.now();
      const elapsedMs = pausedElapsedMs + (now - startTimestamp);
      const { eachMs, totalMs, rc } = getValues();

      if (eachMs <= 0 || totalMs <= 0) {
        running = false;
        statusEl.textContent = "Enter a cycle time greater than zero.";
        return;
      }

      // Continuous operation:
      // totalElapsed keeps increasing forever.
      // sequenceElapsed wraps back to 0 after each full RC sequence.
      const absoluteCycle = Math.floor(elapsedMs / eachMs);
      const sequenceNumber = Math.floor(elapsedMs / totalMs);
      const sequenceElapsed = elapsedMs % totalMs;

      // Detect each cycle boundary exactly once.
      if (absoluteCycle > lastAbsoluteCycle) {
        for (let c = lastAbsoluteCycle + 1; c <= absoluteCycle; c++) {
          if (c % rc === 0) {
            resetAlarm();   // full reset: back to 0
          } else {
            countAlarm();   // ordinary count change
          }
        }
        lastAbsoluteCycle = absoluteCycle;
      }

      if (sequenceNumber > lastSequenceNumber) {
        readyCard.classList.remove("ready-flash");
        void readyCard.offsetWidth;
        readyCard.classList.add("ready-flash");
        lastSequenceNumber = sequenceNumber;
      }

      const currentCount = Math.floor(sequenceElapsed / eachMs);
      const elapsedInCurrentCycle = sequenceElapsed % eachMs;

      let intervalRemaining = eachMs - elapsedInCurrentCycle;
      let timeTillReady = totalMs - sequenceElapsed;

      // Avoid displaying a full interval due only to floating-point edge behavior.
      if (intervalRemaining > eachMs) intervalRemaining = eachMs;
      if (timeTillReady > totalMs) timeTillReady = totalMs;

      countDisplayEl.textContent = currentCount;
      intervalRemainingEl.textContent = formatTime(intervalRemaining);
      readyTimeEl.textContent = formatTime(timeTillReady);
      statusEl.textContent = `Running — sequence ${sequenceNumber + 1}.`;

      animationId = requestAnimationFrame(render);
    }

    function startTimer() {
      const { eachMs } = getValues();

      if (eachMs <= 0) {
        statusEl.textContent = "Enter a cycle time greater than zero.";
        return;
      }

      if (running) return;

      running = true;
      startTimestamp = performance.now();

      // Sync boundary tracking to current elapsed time so resuming does not replay alarms.
      lastAbsoluteCycle = Math.floor(pausedElapsedMs / eachMs);
      const { totalMs } = getValues();
      lastSequenceNumber = Math.floor(pausedElapsedMs / totalMs);

      readyCard.classList.remove("ready-flash");
      statusEl.textContent = "Running.";
      render();
    }

    function pauseTimer() {
      if (!running) return;

      pausedElapsedMs += performance.now() - startTimestamp;
      running = false;

      if (animationId) {
        cancelAnimationFrame(animationId);
      }

      statusEl.textContent = "Paused.";
    }

    function resetTimer() {
      running = false;

      if (animationId) {
        cancelAnimationFrame(animationId);
      }

      pausedElapsedMs = 0;
      finished = false;
      lastAbsoluteCycle = 0;
      lastSequenceNumber = 0;
      readyCard.classList.remove("ready-flash");
      updateStaticDisplay();
    }

    [atInput, sdInput, bedInput, rcInput].forEach(input => {
      input.addEventListener("input", updateStaticDisplay);
    });

    startBtn.addEventListener("click", startTimer);
    pauseBtn.addEventListener("click", pauseTimer);
    resetBtn.addEventListener("click", resetTimer);

    updateStaticDisplay();
  </script>
</body>
</html>
